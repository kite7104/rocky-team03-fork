# Lets the API pod create and watch the pipeline Jobs in this workspace.
# Apply once: kubectl apply -f server/k8s/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocky-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rocky-api
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rocky-api
subjects:
  - kind: ServiceAccount
    name: rocky-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rocky-api

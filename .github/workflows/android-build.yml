name: Android build and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        # Server address/key for the APK come from repository secrets when set
        # (Settings > Secrets > Actions: ROCKY_SERVER_URL, ROCKY_API_KEY).
        env:
          ORG_GRADLE_PROJECT_rocky.serverUrl: ${{ secrets.ROCKY_SERVER_URL }}
          ORG_GRADLE_PROJECT_rocky.apiKey: ${{ secrets.ROCKY_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rocky-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
